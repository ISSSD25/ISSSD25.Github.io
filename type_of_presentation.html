<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tipos de Apresentação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Templates e instruções para os tipos de apresentação.">
  <meta name="author" content="isssd25">
  <link rel="icon" href="./img/icon.webp" type="image/webp">

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #F0F2F2;
      margin: 0;
      padding: 0;
      color: #202020;
    }

    .box {
      margin: 50px auto;
      max-width: 900px;
      background: #fff;
      padding: 40px 50px;
      border: 1px solid #E4EAF1;
      border-radius: 8px;
    }

    .box h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      color: #003366;
    }

    .box p {
      font-size: 16px;
      text-align: center;
      margin-bottom: 30px;
    }

    .btn-link {
      display: inline-block;
      background-color: #007BFF;
      color: #fff;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 5px;
      font-size: 16px;
      margin: 10px;
      font-weight: bold;
    }

    .btn-link:hover {
      background-color: #0056b3;
    }

    .btn-container {
      text-align: center;
      margin-bottom: 40px;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .pdf-fallback {
      text-align: center;
      margin-top: 20px;
    }

    .pdf-fallback a {
      color: #007BFF;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .box {
        padding: 30px 20px;
      }

      iframe {
        height: 500px;
      }

      .btn-link {
        width: 90%;
        display: block;
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Templates e Instruções</h1>
    <p>Use os botões abaixo para baixar os templates e visualize o PDF das instruções diretamente nesta página.</p>

    <div class="btn-container">
      <a class="btn-link" href="drive/TemplateCommunication-XXV ISSSD(2).pptx" download> Template Communication</a>
      <a class="btn-link" href="drive/TemplatePoster-XXVISSSD(1).pptx" download> Temmplate Poster</a>
    </div>

    <h2 style="text-align:center; margin-bottom: 20px;"> Instruções de Apresentação</h2>

    <iframe src="docs/instrucoes_apresentacao.pdf#toolbar=1&navpanes=0&scrollbar=1">
      Este navegador não suporta visualização de PDF. <br>
    </iframe>

    <div class="pdf-fallback">
      <p>Se o PDF não carregar, <a href="drive/Type of Presentation - XXV ISSSD-1.pdf" target="_blank">clique aqui para abrir em nova aba</a>.</p>
    </div>
  </div>

</body>
</html>
