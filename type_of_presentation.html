<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Instructions for Presenters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <link href="./files/css2" rel="stylesheet">
  <link rel="stylesheet" href="./files/all.min.css">
  <link rel="stylesheet" href="./files/bootstrap.css">
  <link rel="stylesheet" href="./files/style.css">

  <style>
    /* Estilos específicos para esta página */
    body {
      font-family: 'Open Sans', Arial, sans-serif;
    }

    .content-box {
      margin-top: 10vh;
      background-color: #fff;
      padding: 50px;
      border: 1px solid #D5D9D9;
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
      border-radius: 8px;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-weight: 700;
    }

    p {
      text-align: center;
      font-size: 16px;
      margin-bottom: 30px;
      color: #69737a;
    }

    .btn-container {
      text-align: center;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007BFF;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
      color: #fff;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .pdf-fallback {
      text-align: center;
      margin-top: 15px;
    }

    .pdf-fallback a {
      color: #007BFF;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      content > .container {
        margin-top: 12vh;
      }
      .content-box {
        padding: 20px;
      }
      iframe {
        height: 500px;
      }
      .btn {
        width: 90%;
        display: block;
        margin: 10px auto;
      }
    }
  </style>
</head>
<body class="page-v2 page-v3">

  <div id="menu-container"></div>

  <div class="limiteImagemFundo">
    <div id="imagemFundo" class="hero-image full-width-image-banner blur-background"
      style="background-image: linear-gradient(rgba(0,0,0,0.5) 1%,rgba(0,0,0,0.4)60%,rgba(240,242,242,1)90%), url(./img/banner.webp)">
    </div>
  </div>

  <div class="container">
    <div class="content-box">
      <h1>Instructions for Presenters</h1>
      <p>Instruction for Presenters, <a href="drive/Instructions for Presenters - XXV ISSSD-1.pdf" target="_blank">click here</a>.</p>
      <p>Download the templates and view the PDF with instructions directly below.</p>
  
          <div class="btn-container">
            <a class="btn" href="drive/TemplateCommunication-XXV%20ISSSD(2).pptx" download>
              Download Template Communication
            </a>
            <a class="btn" href="drive/TemplatePoster-XXVISSSD(1).pptx" download>
              Download Template Poster
            </a>
          </div>
  
      <iframe src="drive/Type of Presentation - XXV ISSSD-1.pdf#toolbar=1&navpanes=0&scrollbar=1">
        This browser does not support PDF viewing.
      </iframe>
  
      <div class="pdf-fallback">
        <p>If the PDF does not load,  <a href="drive/Type of Presentation - XXV ISSSD-1.pdf" target="_blank">click here to open it in a new tab.</a>.</p>
      </div>
    </div>
  </div>

</body>
</html>
