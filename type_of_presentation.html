<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Instruções para Apresentação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #202020;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
      background-color: #fff;
    }

    h1 {
      text-align: center;
      color: #003366;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .btn-container {
      text-align: center;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007BFF;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .pdf-fallback {
      text-align: center;
      margin-top: 15px;
    }

    .pdf-fallback a {
      color: #007BFF;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      iframe {
        height: 500px;
      }

      .btn {
        width: 90%;
        display: block;
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Instruções para Apresentação</h1>
    <p>Baixe os templates e visualize o PDF com as instruções diretamente abaixo.</p>

    <div class="btn-container">
      <a class="btn" href="drive/TemplateCommunication-XXV%20ISSSD(2).pptx" download>
        Baixar Template Communication
      </a>
      <a class="btn" href="drive/TemplatePoster-XXVISSSD(1).pptx" download>
        Baixar Template Poster
      </a>
    </div>

    <iframe src="drive/Type of Presentation - XXV ISSSD-1.pdf#toolbar=1&navpanes=0&scrollbar=1">
      Este navegador não suporta visualização de PDF.
    </iframe>

    <div class="pdf-fallback">
      <p>Se o PDF não carregar, <a href="drive/Type of Presentation - XXV ISSSD-1.pdf" target="_blank">clique aqui para abrir em nova aba</a>.</p>
    </div>
  </div>

</body>
</html>
