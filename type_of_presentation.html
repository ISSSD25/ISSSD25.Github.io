<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tipos de Apresentação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Templates e instruções para os tipos de apresentação.">
  <meta name="author" content="isssd25">

  <!-- Ícones -->
  <link rel="icon" href="./img/icon.webp" type="image/webp">

  <!-- Estilo oficial -->
  <style>
    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen-Sans", "Ubuntu", "Cantarell", "Helvetica Neue", sans-serif;
      background: #F0F2F2;
      margin: 0;
      padding: 0;
      color: #202020;
    }

    .box {
      margin: 50px auto;
      max-width: 800px;
      background: #fff;
      padding: 40px 50px;
      border: 1px solid #E4EAF1;
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
      border-radius: 5px;
    }

    .box h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      color: #003366;
    }

    .box p {
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 30px;
    }

    .btn-link {
      display: inline-block;
      background-color: #007BFF;
      color: #fff;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 5px;
      font-size: 16px;
      margin: 10px;
      font-weight: bold;
      text-align: center;
    }

    .btn-link:hover {
      background-color: #0056b3;
    }

    .btn-container {
      text-align: center;
    }

    @media (max-width: 600px) {
      .box {
        padding: 30px 20px;
      }

      .btn-link {
        width: 90%;
        margin: 10px auto;
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Templates e Instruções</h1>
    <p>Use os botões abaixo para baixar os templates de apresentação e acessar o PDF com instruções detalhadas.</p>

    <div class="btn-container">
      <a class="btn-link" href="drive/TemplateCommunication-XXV ISSSD(2).pptx" download> Baixar Template 1</a>
      <a class="btn-link" href="drive/TemplatePoster-XXVISSSD(1).pptx" download> Baixar Template 2</a>
      <a class="btn-link" href="drive/Type of Presentation - XXV ISSSD-1.pdf" target="_blank"> Visualizar Instruções (PDF)</a>
    </div>
  </div>

</body>
</html>
