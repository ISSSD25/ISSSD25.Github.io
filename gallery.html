<!DOCTYPE html>
<html lang="pt-br">

<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./files/css2" rel="stylesheet">
<link rel="stylesheet" href="./files/all.min.css">
<link rel="stylesheet" href="./files/bootstrap.css">
<link rel="stylesheet" href="./files/style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Estilo Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fafafa;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            margin-top: 4rem;
        }

        .main-image {
            max-width: 90vw;
            max-height: 60vh;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            margin-bottom: 2rem;
            object-fit: cover;
        }

        .gallery-link {
            font-size: 1.2rem;
            color: #fff;
            background: #3897f0;
            padding: 0.75em 1.5em;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
            font-weight: 500;
        }

        .gallery-link:hover {
            background: #256bb5;
        }

        .main-text {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            color: #333;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="menu-container"></div>

    <div class="main-content">
        <!-- Sua imagem principal -->
        <img class="main-image"
            src="./img/gallery/photo.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
            alt="Encontro casual em café ao ar livre">
        <div class="main-text">
            Access the full gallery <a href="https://drive.google.com/drive/folders/1FmrZJVcuahuXfSBnheqxn-HoQ6kIihnM?usp=drive_link" target="_blank" rel="noopener" >here</a>
        </div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>

    <script type="text/babel" src="./js/menu.js"></script>
</body>

</html>
