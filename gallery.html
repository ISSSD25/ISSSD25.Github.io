<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Estilo Instagram</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./files/all.min.css">
    <link rel="stylesheet" href="./files/bootstrap.css">
    <link rel="stylesheet" href="./files/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fafafa;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            margin-top: 4rem;
            padding: 0 1rem; /* Adicionado para evitar que o conteúdo toque as bordas em telas pequenas */
        }

        .main-image {
            max-width: 90vw;
            max-height: 60vh;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            margin-top: 3rem;
            margin-bottom: 2rem;
            object-fit: cover;
        }
        
        .main-text {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            color: #333;
            text-align: center;
        }
        iframe {
            margin-top: 3rem; /* Espaço acima do vídeo */
            margin-bottom: 2.5rem; /* Espaço abaixo do vídeo */
            max-width: 90vw; /* Garante que o vídeo não ultrapasse a largura da tela */
            border-radius: 12px; /* Bordas arredondadas para combinar com a imagem */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); /* Sombra para combinar com a imagem */
        }

    </style>
</head>

<body>
    <div id="menu-container"></div>

    <div class="main-content">
        <img class="main-image"
            src="./img/gallery/photo.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
            alt="Encontro casual em café ao ar livre">
        <div class="main-text">
            Access the full photo gallery <a href="https://drive.google.com/drive/folders/1FmrZJVcuahuXfSBnheqxn-HoQ6kIihnM?usp=drive_link" target="_blank" rel="noopener" >here</a>
        </div>

        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/videoseries?si=_G8SqC01uRfebWOM&amp;list=PL97RRob4chXlPItYf-bcLafW7uvvi6JwP" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen
        ></iframe>

        <div class="main-text">
            Access the video recording playlist <a href="https://youtube.com/playlist?list=PL97RRob4chXlPItYf-bcLafW7uvvi6JwP&si=DTKd6O4QziZuphrR" target="_blank" rel="noopener" >here</a>
        </div>

        <iframe

            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen
        ></iframe>

        <div class="main-text">
            Access the Lattice session playlist <a href="https://www.youtube.com/playlist?list=PL97RRob4chXnSBXZvv_li-nJVtfOxWHmP" target="_blank" rel="noopener" >here</a>
        </div>

        <iframe 
            width="560"

            src="https://www.youtube.com/embed/videoseries?si=Bj52OQZKFSzc1KLP&amp;list=PL97RRob4chXknA4zzJ8_prE8WrdXiQKUV" 
            title="YouTube video player"

        <div class="main-text">
            Access the Spectrum session playlist <a href="https://www.youtube.com/playlist?list=PL97RRob4chXknA4zzJ8_prE8WrdXiQKUV" target="_blank" rel="noopener" >here</a>

        <iframe 
            width="560"

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>

    <script type="text/babel" src="./js/menu.js"></script>
</body>

</html>
