<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple PDF Viewer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Ensure the iframe takes up the full height of the viewport */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .viewer-container {
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <main class="h-full">
        <!-- PDF Viewer Section -->
        <div class="viewer-container bg-white">
            <!-- 
                IMPORTANT: Replace the 'src' value below with the path to your PDF file.
                This can be a URL or a local path relative to this HTML file.
                Example: src="https://example.com/my-document.pdf"
                Example: src="./documents/report.pdf"
            -->
            <iframe id="pdf-viewer" src="./drive/Complete_Programme_XXV_ISSSD.pdf" class="w-full h-full" frameborder="0">
                Your browser does not support iframes. Please use a modern browser to view PDFs.
            </iframe>
        </div>
    </main>

</body>
</html>
