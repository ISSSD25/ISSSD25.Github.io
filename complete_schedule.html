<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <link href="./files/css2" rel="stylesheet">
  <link rel="stylesheet" href="./files/all.min.css">
  <link rel="stylesheet" href="./files/bootstrap.css">
  <link rel="stylesheet" href="./files/style.css">

  <style>
    body {
      font-family: 'Open Sans', Arial, sans-serif;
    }

    .content-box {
      margin-top: 10vh;
      background-color: #fff;
      padding: 50px;
      border: 1px solid #D5D9D9;
      box-shadow: 0 1px 1px rgb(0 0 0 / 10%);
      border-radius: 8px;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-weight: 700;
    }

    p {
      text-align: center;
      font-size: 16px;
      margin-bottom: 30px;
      color: #69737a;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .pdf-fallback {
      text-align: center;
      margin-top: 15px;
    }

    .pdf-fallback a {
      color: #007BFF;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .content-box {
        padding: 20px;
      }
      iframe {
        height: 500px;
      }
    }
  </style>
</head>
<body class="page-v2 page-v3">

  <div id="menu-container"></div>

  <div class="limiteImagemFundo">
    <div id="imagemFundo" class="hero-image full-width-image-banner blur-background"
      style="background-image: linear-gradient(rgba(0,0,0,0.5) 1%,rgba(0,0,0,0.4)60%,rgba(240,242,242,1)90%), url(./img/banner.webp)">
    </div>
  </div>

  <div class="container">
    <div class="content-box">
      <h1>Schedule</h1>

      <p> Check out here the general schedule of the event. </p>

      <img src="drive/schedule-general-verrtical-SITE(7).png" 
        alt="Schedule"
        style="width:100%; height:auto; border:1px solid #ccc; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,0.1); margin-top: 20px; margin-bottom: 20px;"
      />

      <p> Check out here the complete schedule of the event. </p>
      
      <iframe src="drive/Complete_Programme_XXV_ISSSD-1.pdf#toolbar=1&navpanes=0&scrollbar=1">
        This browser does not support PDF viewing.
      </iframe>
  
      <div class="pdf-fallback">
        <p>If the PDF does not load,  <a href="drive/Complete_Programme_XXV_ISSSD-1.pdf" target="_blank">click here to open it in a new tab.</a>.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
  
  <script type="text/babel" src="./js/menu.js"></script>

</body>
</html>
